<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | Azhagu Mayil Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">

  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand-logo">
        <div style="width:2.5rem; height:2.5rem; border-radius:50%; background:#FAF7F2; border:1px solid #D4AF37; display:flex; align-items:center; justify-content:center; color:#9E782F; font-size:1.2rem;">🦚</div>
        <div class="brand-text">
          <h1>Azhagu Mayil</h1>
          <span>Collection · salem</span>
        </div>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">← Back to Storefront</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container" style="padding: 3rem 1.25rem; max-width: 450px;">
    <div style="background: white; padding: 2.5rem; border-radius: 1.5rem; border: 1px solid var(--color-border); box-shadow: 0 10px 25px rgba(0,0,0,0.05);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <span style="font-size: 2rem;">🦚</span>
        <h1 class="font-serif" style="font-size: 1.75rem; color: #380510; margin-top: 0.5rem;">Sign In</h1>
        <p style="color: #666; font-size: 0.8rem;">Access your orders & saved sarees</p>
      </div>

      <form onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem;">Email Address</label>
          <input type="email" id="login-email" required placeholder="name@example.com" style="width: 100%; padding: 0.6rem; border: 1px solid var(--color-border); border-radius: 0.5rem; font-size: 0.85rem;">
        </div>

        <div>
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem;">Password</label>
          <input type="password" required placeholder="••••••••" style="width: 100%; padding: 0.6rem; border: 1px solid var(--color-border); border-radius: 0.5rem; font-size: 0.85rem;">
        </div>

        <button type="submit" class="maroon-btn" style="justify-content: center; margin-top: 0.5rem;">Sign In to Azhagu Mayil</button>
      </form>

      <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid #eee; text-align: center;">
        <p style="font-size: 0.75rem; color: #888; margin-bottom: 0.75rem;">One-Click Demo Access</p>
        <button onclick="handleAdminLogin()" class="gold-btn" style="width: 100%; justify-content: center; font-size: 0.8rem;">Switch to Admin Dashboard 🛡️</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container" style="text-align: center; font-size: 0.8rem; color: #FAF7F2;">
      © 2026 Azhagu Mayil Collection. All Rights Reserved.
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
