<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | Azhagu Mayil Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand-logo">
        <div style="width:2.5rem; height:2.5rem; border-radius:50%; background:#FAF7F2; border:1px solid #D4AF37; display:flex; align-items:center; justify-content:center; color:#9E782F; font-size:1.2rem;">🦚</div>
        <div class="brand-text">
          <h1>Azhagu Mayil</h1>
          <span>Collection · Chennai</span>
        </div>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <a href="cart.html" class="icon-btn" title="Cart">🛍️ <span class="badge-count cart-count-badge" style="display:none;">0</span></a>
      </div>
    </div>
  </header>

  <div class="container" style="padding: 3rem 1.25rem;">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 3rem; background: white; padding: 2rem; border-radius: 1.5rem; border: 1px solid var(--color-border);">
      <!-- Image gallery -->
      <div>
        <div style="border-radius: 1rem; overflow: hidden; aspect-ratio: 4/3; background: #FAF7F2; margin-bottom: 1rem;">
          <img id="pdp-main-img" src="" alt="Saree" style="width: 100%; height: 100%; object-fit: cover;">
        </div>
      </div>

      <!-- Specs & Actions -->
      <div>
        <h1 class="font-serif" id="pdp-title" style="font-size: 2rem; color: #380510; margin-bottom: 0.5rem;">Loading Saree...</h1>
        <div style="display: flex; gap: 0.75rem; align-items: baseline; margin-bottom: 1rem;">
          <span class="font-mono" id="pdp-price" style="font-size: 1.75rem; font-weight: 700; color: var(--color-maroon);"></span>
          <span class="font-mono" id="pdp-original-price" style="font-size: 1rem; color: #888; text-decoration: line-through;"></span>
        </div>

        <p id="pdp-desc" style="color: #444; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.5rem;"></p>

        <div style="border-top: 1px solid #eee; border-bottom: 1px solid #eee; padding: 1rem 0; margin-bottom: 1.5rem; font-size: 0.85rem; display: flex; flex-direction: column; gap: 0.5rem;">
          <div><strong>Fabric:</strong> <span id="pdp-material"></span></div>
          <div><strong>Color:</strong> <span id="pdp-color"></span></div>
          <div><strong>Blouse Piece:</strong> 0.8m Included unstitched</div>
          <div><strong>Care:</strong> Dry Clean Only</div>
        </div>

        <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem;">
          <label style="font-size: 0.85rem; font-weight: 600;">Qty:</label>
          <input type="number" id="pdp-qty" value="1" min="1" max="10" style="width: 60px; padding: 0.5rem; border: 1px solid var(--color-border); border-radius: 0.5rem;">
        </div>

        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <button id="pdp-add-cart" class="gold-btn" style="flex: 1; justify-content: center;">Add to Bag</button>
          <button id="pdp-buy-now" class="maroon-btn" style="flex: 1; justify-content: center;">Buy Now</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container" style="text-align: center; font-size: 0.8rem; color: #FAF7F2;">
      © 2026 Azhagu Mayil Collection. All Rights Reserved.
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/main.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
